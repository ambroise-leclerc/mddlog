name: Set up Clang 21 and libc++
description: >-
  Pinned CMake, upstream LLVM/Clang 21 with libc++ and ccache, verified, plus a persisted ccache
  directory. Shared by every job in clang-build.yml so the build, clang-tidy and sanitizer jobs
  cannot drift onto different toolchains.

inputs:
  cache-key:
    description: Distinguishes the ccache entries of jobs whose compilations differ (Release, Debug).
    required: true
  save-cache:
    description: >-
      'false' only restores. Jobs that compile the same thing as another job (the clang-tidy shards
      rebuild the Release preset) restore its entry instead of racing to save duplicates.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
  # Pinned, not 'latest': the root CMakeLists.txt rejects CMake 4.4+ outright until this project
  # has reviewed that series' import-std gate, so a floating version turns these jobs red the day
  # 4.4 ships with no change to the repository.
  - name: Setup CMake (4.3.1, within the qualified 4.0-4.3 window)
    uses: jwlawson/actions-setup-cmake@v2
    with:
      cmake-version: '4.3.1'

  - name: Install LLVM/Clang 21 and libc++
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      LLVM_KEY_FPR="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
      sudo install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.asc
      gpg --show-keys --with-colons --fingerprint /tmp/llvm-snapshot.asc \
        | awk -F: '/^fpr:/ {print $10}' | grep -qx "$LLVM_KEY_FPR"
      gpg --dearmor < /tmp/llvm-snapshot.asc > /tmp/llvm.gpg
      sudo install -m 0644 /tmp/llvm.gpg /etc/apt/keyrings/llvm.gpg
      codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
      echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-21 main" \
        | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list
      sudo apt-get update
      sudo apt-get install -y ninja-build build-essential ccache clang-21 clang-tidy-21 libc++-21-dev libc++abi-21-dev python3

  # Verifies the binaries this build actually uses, which are not necessarily the ones on PATH:
  # the toolchain file addresses /usr/lib/llvm-21/bin directly.
  - name: Verify Clang 21 is the compiler this job uses
    shell: bash
    run: |
      set -euo pipefail
      clangxx=/usr/lib/llvm-21/bin/clang++
      "$clangxx" --version
      major="$("$clangxx" --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)"
      if [ "$major" != "21" ]; then
        echo "::error::${clangxx} reports major version ${major}, expected 21."
        exit 1
      fi
      ccache_version="$(ccache --version | sed -n 's/^ccache version \([0-9][0-9.]*\).*/\1/p' | head -1)"
      if ! dpkg --compare-versions "$ccache_version" ge 4.8; then
        echo "::error::ccache ${ccache_version:-unknown} cannot accept per-compilation BMI inputs; 4.8+ is required."
        exit 1
      fi

  - name: Report the libc++ std module manifest
    shell: bash
    run: |
      set -euo pipefail
      found="$(find /usr/lib/llvm-21 -name 'libc++.modules.json' 2>/dev/null || true)"
      if [ -z "$found" ]; then
        echo "::warning::No libc++.modules.json in this packaging; import std cannot resolve for libc++."
      else
        echo "$found"
      fi

  # Outside the workspace, so the "no source-tree writes" check is unaffected. The build's own
  # launcher (cmake/Cache.cmake) already hashes imported BMIs into every cached consumer, and
  # build.cache.namedModuleIntegrity verifies that on each run, so a restored cache cannot serve
  # an object compiled against a stale module interface. The key ends in the commit so every run
  # saves its own entry; restore-keys picks the newest one from this branch, then from develop.
  - name: Point ccache at a persisted directory
    shell: bash
    run: |
      {
        echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
        echo "CCACHE_MAXSIZE=400M"
      } >> "$GITHUB_ENV"

  - name: Restore and save ccache
    if: inputs.save-cache == 'true'
    uses: actions/cache@v4
    with:
      path: ${{ runner.temp }}/ccache
      key: ccache-clang21-${{ inputs.cache-key }}-${{ github.sha }}
      restore-keys: |
        ccache-clang21-${{ inputs.cache-key }}-

  - name: Restore ccache only
    if: inputs.save-cache != 'true'
    uses: actions/cache/restore@v4
    with:
      path: ${{ runner.temp }}/ccache
      key: ccache-clang21-${{ inputs.cache-key }}-${{ github.sha }}
      restore-keys: |
        ccache-clang21-${{ inputs.cache-key }}-
