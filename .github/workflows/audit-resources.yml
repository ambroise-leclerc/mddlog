name: Audit Resources
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    name: Resource profile (Linux x86_64 Clang 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-clang21
        with:
          cache-key: audit-resources
      - name: Configure and build the measured tuple
        run: |
          cmake -S . -B build-resources -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-clang21-libcxx.cmake \
            -DCMAKE_BUILD_TYPE=Release -DMDDLOG_BUILD_TESTS=ON -DMDDLOG_BUILD_EXAMPLES=OFF
          cmake --build build-resources --target mddlog_resource_bench mddlog_host_resource_bench mddlog_service_resource_bench mddlog_specs --parallel 4
      - name: Verify hostile limits and semantic equivalence
        run: ctest --test-dir build-resources -R 'Audit (resource|provider budgets|consumer profiles|recovery refuses)|Generated audit cuts|Audit (retention|restart)' --no-tests=error --output-on-failure
      - name: Measure the large corpus against the software envelope
        run: python3 scripts/run-resource-bench.py build-resources/tests/mddlog_resource_bench --count 49152 --runs 3 --host-binary build-resources/tests/mddlog_host_resource_bench --service-binary build-resources/tests/mddlog_service_resource_bench --output build-resources/resources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-resource-measurements
          path: build-resources/resources.json
          if-no-files-found: error
