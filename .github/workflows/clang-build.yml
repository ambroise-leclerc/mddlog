name: Linux Clang Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
    # Markdown changes nothing this workflow builds or tests; pushes to develop/master still run.
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in flight. Every other run gets a group
# of its own (run_id): a shared per-branch group would let a newer push replace a still-pending
# one, so an intermediate develop/master commit could go unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Three independent jobs instead of one sequential one: the Release build and its tests, the
# clang-tidy analysis (sharded), and the ASan/UBSan Debug configuration. Each sets up the same
# toolchain through .github/actions/setup-clang21, so they cannot drift apart.
jobs:
  clang-build:
    name: Linux (Clang 21, libc++)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Clang 21, libc++ and ccache
      uses: ./.github/actions/setup-clang21
      with:
        cache-key: release

    # The preset, not an equivalent-looking configure line: CMakePresets.json's ninja-clang
    # description exists precisely to keep the preset and CI from drifting apart.
    - name: Configure CMake
      run: cmake --preset ninja-clang

    - name: Build
      run: cmake --build --preset ninja-clang

    - name: Verify governed boundary and negative controls
      run: ctest --preset ninja-clang -L governed --verbose --no-tests=error --timeout 120

    # -LE governed: the step above already ran (and verbosely logged) every governed test.
    - name: Run tests
      run: ctest --preset ninja-clang -LE governed --parallel --output-on-failure --no-tests=error --timeout 120

    # Privileged namespace setup maps five high UIDs; test actors drop all UID authority.
    # This job requires the independent-authority proof instead of accepting a CTest SKIP.
    - name: Verify independent witness authorities
      run: |
        sudo python3 scripts/run-witness-deployment.py \
          --worker "$PWD/build-clang/tests/mddlog_witness_deployment" \
          --service "$PWD/build-clang/examples/mddlog_witness" --require-isolation

    - name: Repeat observed storage interruptions
      run: |
        python3 scripts/run-file-storage-campaign.py \
          --worker build-clang/tests/mddlog_file_storage_campaign \
          --output build-clang/storage-interruptions --iterations 10

    # Real ENOSPC on a bounded tmpfs in a private mount namespace. Containers may
    # skip the optional volume test in CTest; this host job requires it to execute.
    - name: Test storage on a real full private volume
      run: |
        sudo python3 scripts/run-file-storage-campaign.py \
          --worker "$PWD/build-clang/tests/mddlog_file_storage_campaign" \
          --output "$PWD/build-clang/storage-full-volume" --volume-only --require-volume

    - name: Make privileged campaign evidence readable
      if: always()
      run: |
        if [ -d build-clang/storage-full-volume ]; then
          sudo chown -R "$(id -u):$(id -g)" build-clang/storage-full-volume
        fi

    - name: Archive storage campaign evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: file-storage-campaign-${{ github.sha }}
        path: |
          build-clang/tests/file-storage-campaign/
          build-clang/storage-interruptions/
          build-clang/storage-full-volume/
        if-no-files-found: error

    # #280-style negative case: only the provider changes, and the second rebuild still has to be
    # a cache hit for the unchanged consumer. Kept as a named step with --no-tests=error so losing
    # the registration cannot masquerade as a green run.
    - name: Verify ccache invalidates named-module consumers
      run: ctest --preset ninja-clang -R '^build\.cache\.namedModuleIntegrity$' -V --no-tests=error

    - name: ccache statistics
      if: always()
      run: ccache --show-stats

    - name: Verify no source-tree writes
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "Build wrote into the source tree:"
          echo "$status"
          exit 1
        fi

  clang-tidy:
    name: clang-tidy 21 (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6 ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Same Release preset as the clang-build job, so its ccache entry serves this rebuild.
    - name: Set up Clang 21, libc++ and ccache
      uses: ./.github/actions/setup-clang21
      with:
        cache-key: release
        save-cache: 'false'

    - name: Configure CMake
      run: cmake --preset ninja-clang

    # clang-tidy needs the preset's compile_commands.json AND its built module interfaces
    # (std, mddlog.*), hence a full build of the preset before the analysis.
    - name: Build
      run: cmake --build --preset ninja-clang

    # The script verifies clang-tidy is major 21, that every file in scope is in the compilation
    # database, and fails on any diagnostic, tool error or unanalysed file. SHARD selects this
    # job's round-robin slice; the six shards together cover the whole scope exactly once. The
    # report (version, units analysed) goes to the log and to the job summary.
    - name: clang-tidy (reference version, module-aware)
      env:
        SHARD: ${{ matrix.shard }}/6
      run: scripts/run-clang-tidy.sh build-clang

  clang-sanitize:
    # The Debug/sanitizer reference configuration for this toolchain (issue #5): libc++'s own
    # instrumentation differs from libstdc++'s, so this is not redundant with sanitizers.yml's
    # GCC 16.1 Debug leg.
    name: Linux (Clang 21, libc++, ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Clang 21, libc++ and ccache
      uses: ./.github/actions/setup-clang21
      with:
        cache-key: debug-asan-ubsan

    - name: Configure ASan and UBSan
      run: |
        cmake --preset ninja-clang-debug \
          -DMDDLOG_BUILD_EXAMPLES=OFF \
          -DENABLE_SANITIZER_ADDRESS=ON \
          -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON

    - name: Build ASan and UBSan
      run: cmake --build --preset ninja-clang-debug

    - name: Run tests under ASan and UBSan
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --preset ninja-clang-debug -E 'InstallTree(Consumer|CoreConsumer)' --parallel --output-on-failure --no-tests=error --timeout 120

    - name: Verify no source-tree writes
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "Build wrote into the source tree:"
          echo "$status"
          exit 1
        fi
