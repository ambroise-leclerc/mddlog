name: Development File Check

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history and tags: the compatibility check compares the inventory with every
          # published release, and the source-package tests read Git objects.
          fetch-depth: 0
      - name: Check development file structure and references
        run: python3 scripts/check-development-file.py
      - name: Check public surface, formats, release archives and migration snippets
        run: python3 -B scripts/check-compatibility.py --git
      - name: Test rejection of inconsistent dossiers
        run: python3 -m unittest discover -s tests/documentation -p 'Test*.py'
