name: Windows Build

# This project requires C++23 import std support (MSVC 17.14+ / Visual Studio 2022 v17.10+).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Pinned, not 'latest': CMakeLists.txt hardcodes CMAKE_EXPERIMENTAL_CXX_IMPORT_STD to a
    # specific UUID that only matches CMake's import-std experimental-feature ABI as of this
    # series - a floating version can flip that UUID under this job and turn "could not find
    # module 'std'" into the failure mode instead of a clear version mismatch.
    - name: Setup CMake (4.1.1)
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.1.1'

    - name: Install Ninja
      run: |
        $NINJA_URL = "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip"
        $NINJA_ZIP = "$env:TEMP\ninja.zip"
        $NINJA_DIR = "$env:TEMP\ninja"
        Invoke-WebRequest -Uri $NINJA_URL -OutFile $NINJA_ZIP
        Expand-Archive -Path $NINJA_ZIP -DestinationPath $NINJA_DIR -Force
        echo "$NINJA_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Locates whatever MSVC version is actually installed on the runner image via vswhere and
    # exports its environment for every later step in this job, rather than hardcoding a Visual
    # Studio edition/version path that breaks silently when the runner image moves on.
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake (MSVC with Ninja)
      run: cmake --preset ninja-msvc
      shell: cmd

    - name: Build
      run: cmake --build --preset ninja-msvc
      shell: cmd

    - name: Run tests
      run: ctest --preset ninja-msvc --output-on-failure --no-tests=error --timeout 120
      shell: cmd

    - name: Verify no source-tree writes
      shell: pwsh
      run: |
        $status = git status --porcelain
        if ($status) {
          Write-Host "Build wrote into the source tree:"
          Write-Host $status
          exit 1
        }
